# Nom du workflow
name: Docker CI Pipeline

# Déclenchement : à chaque push sur la branche main
on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    # Machine virtuelle utilisée par GitHub
    runs-on: ubuntu-latest

    steps:
      # Récupération du code du dépôt
      - name: Checkout repository
        uses: actions/checkout@v3

      # Connexion à Docker Hub avec les secrets
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Construction de l'image Docker
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/flask-app:v2 .

      # Envoi de l'image vers Docker Hub
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/flask-app:v2